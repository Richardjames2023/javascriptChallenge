<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Drun Kit</title>
</head>
<body>
    <div class="keys">
        <div data-key="65" class="key">
            <kbd>A</kbd>
            <span class="sound">clap</span>
        </div>
        <div data-key="83" class="key">
            <kbd>S</kbd>
            <span class="sound">hihit</span>
        </div>
        <div data-key="68" class="key">
            <kbd>D</kbd>
            <span class="sound">Kick</span>
        </div>
        <div data-key="70" class="key">
            <kbd>F</kbd>
            <span class="sound">Openhat</span>
        </div>
        <div data-key="71" class="key">
            <kbd>g</kbd>
            <span class="sound">Boom</span>
        </div>
        <div data-key="72" class="key">
            <kbd>h</kbd>
            <span class="sound">Ride</span>
        </div>
        <div data-key="74" class="key">
            <kbd>J</kbd>
            <span class="sound">Snare</span>
        </div>
        <div data-key="75" class="key">
            <kbd>k</kbd>
            <span class="sound">Tom</span>
        </div>
        <div data-key="76" class="key">
            <kbd>L</kbd>
            <span class="sound">tink</span>
        </div>
    </div>
    <audio data-key="65" src="sound/tr808-clap-241405.mp3"></audio>
    <audio data-key="83" src="sound/hi-hat.mp3"></audio>
    <audio data-key="68" src="sound/kick-drum-263837.mp3"></audio>
    <audio data-key="70" src="sound/openhat.mp3"></audio>
    <audio data-key="71" src="sound/boom.mp3"></audio>
    <audio data-key="72" src="sound/ride.mp3"></audio>
    <audio data-key="74" src="sound/tr909-snare-drum-241413.mp3"></audio>
    <audio data-key="75" src="sound/tom-2-85124.mp3"></audio>
    <audio data-key="76" src="sound/floor-tom-2-87286.mp3"></audio>

    <script>

        function playSound (e){
            const audio = document.querySelector(`audio[data-key="${e.keyCode}"]`);
            const key = document.querySelector(`.key[data-key="${e.keyCode}"]`);
            if(!audio) return; //stop the fuinction from running altogether
            audio.currentTime = 0; // rewind to the start
            audio.play();
            key.classList.add('playing');
        }

        function removeTransition(e){
            if(e.propertyName !== 'transform') return; //skip it if its not a transform
            this.classList.remove('playing');
        }
        const keys = document.querySelectorAll('.key');
        keys.forEach(key => key.addEventListener('transitionend', removeTransition));
        window.addEventListener('keydown', playSound);
    </script>
</body>
</html>
